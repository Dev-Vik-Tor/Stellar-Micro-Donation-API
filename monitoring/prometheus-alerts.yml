# Prometheus Alert Rules for Stellar Micro Donation API
#
# Issue #1225: Define SLOs and alerting rules for key endpoints and jobs
# Issue #1396: Fix alert expressions to use actual metric names from src/utils/metrics.js
#
# All metric names and label names here match what the application actually emits.
# See src/utils/metrics.js for the authoritative list.
#
# Actual metrics emitted:
#   http_request_duration_seconds{method, route, status_code}  (Histogram)
#   stellar_donations_total{status}                            (Counter)
#   stellar_recurring_donations_due_total                      (Counter)
#   stellar_recurring_donations_executed_total{status}         (Counter)
#   stellar_recurring_donations_execution_duration_seconds     (Histogram)
#   stellar_recurring_donations_suspended_total                (Counter)
#   stellar_recurring_donations_active_count                   (Gauge)
#   recurring_donations_skipped_total{reason}                  (Counter)
#   horizon_pool_size                                          (Gauge)
#   horizon_pool_healthy_count                                 (Gauge)
#   horizon_pool_unhealthy_count                               (Gauge)
#   horizon_pool_cooldown_events_total                         (Counter)
#   horizon_pool_recovery_events_total                         (Counter)
#   horizon_pool_acquire_duration_seconds                      (Histogram)
#   process_resident_memory_bytes                              (Gauge, default metrics)
#   nodejs_heap_size_limit_bytes                               (Gauge, default metrics)
#   nodejs_eventloop_lag_seconds                               (Gauge, default metrics)
#
# To use:
# 1. Copy this file to your Prometheus config directory
# 2. Reference in prometheus.yml:
#    rule_files:
#      - 'prometheus-alerts.yml'
# 3. Restart Prometheus
# 4. Configure alertmanager to handle alerts

groups:
  - name: stellar_donation_api_slos
    interval: 30s
    rules:
      # ─── API Availability SLO ────────────────────────────────────────────────
      #
      # The app emits http_request_duration_seconds with label status_code (not status).
      # We derive availability from the _count suffix of the histogram, filtering
      # by status_code label.

      - alert: APIAvailabilityBelowSLO
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{status_code=~"2.."}[5m])) +
            sum(rate(http_request_duration_seconds_count{status_code=~"3.."}[5m]))
          ) /
          sum(rate(http_request_duration_seconds_count[5m])) < 0.99
        for: 5m
        labels:
          severity: critical
          slo: availability
          service: stellar-donation-api
        annotations:
          summary: "API availability below 99% SLO"
          description: |
            HTTP request success rate is {{ $value | humanizePercentage }} over the last 5 minutes.
            SLO requires >= 99% availability.

            Affected endpoints: Check /metrics endpoint for per-route breakdown.

            Action items:
            1. Check API logs for error patterns: grep ERROR /var/log/api.log
            2. Review recent deployments: git log --oneline -10
            3. Check database connection pool: curl /health/ready
            4. See runbook: docs/RUNBOOKS.md#api-availability

      - alert: APIErrorRateAboveSLO
        expr: |
          sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m])) /
          sum(rate(http_request_duration_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
          slo: error_rate
          service: stellar-donation-api
        annotations:
          summary: "API error rate above SLO threshold"
          description: |
            HTTP 5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes.
            SLO requires < 0.5% error rate.

            Immediate actions:
            1. Check application logs for stack traces
            2. Review database query performance
            3. Check external service connectivity (Horizon)

            Runbook: docs/RUNBOOKS.md#api-error-rate

      # ─── API Latency SLO ──────────────────────────────────────────────────────

      - alert: APIP95LatencyAboveSLO
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.3
        for: 5m
        labels:
          severity: warning
          slo: latency
          percentile: p95
          service: stellar-donation-api
        annotations:
          summary: "API P95 latency above SLO ({{ $value | humanizeDuration }})"
          description: |
            95th percentile request latency is {{ $value | humanizeDuration }}.
            SLO requires P95 <= 200ms.

            Diagnostics:
            1. Check slow endpoint: top slow routes in /metrics
            2. Review database query performance: EXPLAIN in SQL logs
            3. Check memory usage: curl /health/live | jq .memory
            4. Review recent code changes

            Runbook: docs/RUNBOOKS.md#api-latency

      - alert: APIP99LatencyAboveSLO
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
          slo: latency
          percentile: p99
          service: stellar-donation-api
        annotations:
          summary: "API P99 latency degraded ({{ $value | humanizeDuration }})"
          description: |
            99th percentile request latency is {{ $value | humanizeDuration }}.
            SLO target P99 <= 1s (warning at 2s).

            Likely causes:
            1. High query load on database
            2. Slow external API (Horizon) responses
            3. Garbage collection pauses
            4. Disk I/O bottleneck

            Runbook: docs/RUNBOOKS.md#api-latency

      # ─── Scheduler Health SLO ─────────────────────────────────────────────────
      #
      # The app does not emit a stellar_scheduler_lag_seconds gauge directly.
      # We use two proxies from the metrics that ARE emitted:
      #
      #   1. A high rate of skipped schedules (recurring_donations_skipped_total)
      #      indicates the scheduler is unable to keep up.
      #   2. A zero rate of due schedules combined with a non-zero active count
      #      may indicate the scheduler has stalled.

      - alert: SchedulerSkipRateWarning
        expr: |
          sum(rate(recurring_donations_skipped_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          slo: scheduler_lag
          service: stellar-donation-api
        annotations:
          summary: "Recurring donation scheduler is skipping schedules at a high rate"
          description: |
            The recurring donation scheduler is skipping {{ $value | humanize }} schedules/s.
            A sustained non-zero skip rate means pending donations are not processed on time.

            Common skip reasons (check the 'reason' label in /metrics):
              - in_progress:      duplicate-execution guard triggered
              - network_degraded: Stellar network issue detected
              - scheduler_paused: scheduler is explicitly paused

            Diagnostics:
            1. Check scheduler logs: grep "RecurringDonationScheduler" /var/log/api.log
            2. Check Stellar network connectivity
            3. Check database pool health

            Runbook: docs/RUNBOOKS.md#scheduler-lag

      - alert: SchedulerSkipRateCritical
        expr: |
          sum(rate(recurring_donations_skipped_total[5m])) > 0.5
        for: 2m
        labels:
          severity: critical
          slo: scheduler_lag
          service: stellar-donation-api
        annotations:
          summary: "CRITICAL: Recurring donation scheduler is skipping at a very high rate"
          description: |
            The recurring donation scheduler is skipping {{ $value | humanize }} schedules/s.
            This is severely impacting pending donation processing.

            IMMEDIATE ACTIONS:
            1. Page on-call engineer NOW
            2. Check if scheduler is still running: ps aux | grep -i node
            3. Check database connectivity: /health/ready
            4. Review last 100 log entries: tail -100 /var/log/api.log
            5. If hung: restart the scheduler process

            Runbook: docs/RUNBOOKS.md#scheduler-lag-critical

      # ─── Recurring Donation Execution SLO ────────────────────────────────────

      - alert: RecurringDonationSuccessRateLow
        expr: |
          sum(rate(stellar_recurring_donations_executed_total{status="success"}[1h])) /
          (
            sum(rate(stellar_recurring_donations_executed_total{status="success"}[1h])) +
            sum(rate(stellar_recurring_donations_executed_total{status="failure"}[1h]))
          ) < 0.98
        for: 10m
        labels:
          severity: critical
          slo: background_job
          job_type: recurring_donations
          service: stellar-donation-api
        annotations:
          summary: "Recurring donation success rate below SLO: {{ $value | humanizePercentage }}"
          description: |
            Recurring donation execution success rate is {{ $value | humanizePercentage }}.
            SLO requires >= 99% success rate.

            Failed donations are being retried but may ultimately fail.

            Diagnostics:
            1. Check Stellar network status
            2. Review error logs: grep "RECURRING_DONATION.*ERROR" /var/log/api.log
            3. Check account balance: curl /api/v1/account
            4. Verify Horizon API connectivity

            Runbook: docs/RUNBOOKS.md#recurring-donation-failure

      - alert: RecurringDonationSuspensionRateHigh
        expr: |
          sum(rate(stellar_recurring_donations_suspended_total[1h])) > 0.01
        for: 10m
        labels:
          severity: warning
          slo: background_job
          job_type: recurring_donations
          service: stellar-donation-api
        annotations:
          summary: "Recurring donation schedules are being suspended at a high rate"
          description: |
            {{ $value | humanize }} schedules/s are being permanently suspended (all retries exhausted).
            Each suspension means a donor's recurring donation has permanently failed.

            Diagnostics:
            1. Check Stellar network connectivity
            2. Review suspension logs: grep "RECURRING_DONATION.*suspended" /var/log/api.log
            3. Confirm donor accounts have sufficient balance

            Runbook: docs/RUNBOOKS.md#recurring-donation-failure

      # ─── Horizon Connection Pool SLO ──────────────────────────────────────────
      #
      # The app emits horizon_pool_size, horizon_pool_healthy_count, and
      # horizon_pool_unhealthy_count from src/utils/metrics.js.
      # Use these to detect pool degradation.

      - alert: HorizonPoolDegraded
        expr: |
          (horizon_pool_unhealthy_count / horizon_pool_size) > 0.5
        for: 5m
        labels:
          severity: warning
          slo: external_api
          external_service: horizon
          service: stellar-donation-api
        annotations:
          summary: "Horizon connection pool is degraded: {{ $value | humanizePercentage }} unhealthy"
          description: |
            More than 50% of Horizon pool members are in cooldown.
            Donation submissions may be slower or fail if all members become unhealthy.

            This may indicate:
            1. Stellar network issues or maintenance
            2. Network connectivity problems to configured Horizon endpoints
            3. Rate limiting from Stellar

            Actions:
            1. Check Stellar status page: https://stellar.org/status
            2. Verify network connectivity: curl https://horizon.stellar.org
            3. Check rate limit headers in logs

            Runbook: docs/RUNBOOKS.md#horizon-connectivity

      - alert: HorizonPoolExhausted
        expr: |
          horizon_pool_healthy_count == 0
        for: 2m
        labels:
          severity: critical
          slo: external_api
          external_service: horizon
          service: stellar-donation-api
        annotations:
          summary: "CRITICAL: All Horizon pool members are unhealthy"
          description: |
            Every member of the Horizon connection pool is in cooldown.
            Donation submissions to Stellar will fail until at least one member recovers.

            IMMEDIATE ACTIONS:
            1. Check Stellar status page: https://stellar.org/status
            2. Verify network connectivity from the server
            3. Check application logs for HORIZON errors
            4. Consider enabling MOCK_STELLAR=true to accept submissions without network calls

            Runbook: docs/RUNBOOKS.md#horizon-connectivity

      - alert: HorizonPoolCooldownRateHigh
        expr: |
          sum(rate(horizon_pool_cooldown_events_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          slo: external_api
          external_service: horizon
          service: stellar-donation-api
        annotations:
          summary: "Horizon API error rate elevated: {{ $value | humanize }} cooldowns/s"
          description: |
            Horizon pool members are entering cooldown at {{ $value | humanize }} events/s.
            This indicates Horizon API calls are frequently failing.

            Actions:
            1. Check Stellar status page: https://stellar.org/status
            2. Verify network connectivity: curl https://horizon.stellar.org
            3. Check rate limit headers in logs

            Runbook: docs/RUNBOOKS.md#horizon-connectivity

      # ─── Transaction Sync Scheduler SLO ───────────────────────────────────────
      #
      # The app does not emit a stellar_transaction_sync_lag_seconds gauge.
      # We monitor the Horizon pool acquire latency as a proxy for sync health:
      # if pool acquisition is slow, transaction sync will also be slow.

      - alert: HorizonPoolAcquireLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(horizon_pool_acquire_duration_seconds_bucket[5m])) by (le)
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          slo: scheduler_lag
          scheduler: transaction_sync
          service: stellar-donation-api
        annotations:
          summary: "Horizon pool acquire P99 latency high: {{ $value | humanizeDuration }}"
          description: |
            The 99th percentile time to acquire a Horizon pool member is {{ $value | humanizeDuration }}.
            High acquisition latency will delay transaction sync and donation submissions.

            Diagnostics:
            1. Check Horizon API responsiveness
            2. Review database query performance
            3. Check scheduler logs

            Runbook: docs/RUNBOOKS.md#transaction-sync-lag

      # ─── Application Startup & Health ────────────────────────────────────────

      - alert: HealthcheckFailing
        expr: |
          up{job="stellar-donation-api"} == 0
        for: 2m
        labels:
          severity: critical
          slo: availability
          service: stellar-donation-api
        annotations:
          summary: "Application health check failing"
          description: |
            Prometheus cannot reach /health/ready endpoint.

            Application may have crashed or port is blocked.

            IMMEDIATE ACTIONS:
            1. Check if process is running: ps aux | grep node
            2. Check port 3000: netstat -tulpn | grep 3000
            3. Check logs for startup errors
            4. Restart application if crashed

            Runbook: docs/RUNBOOKS.md#application-down

      # ─── General Node.js Health ──────────────────────────────────────────────

      - alert: HighMemoryUsage
        expr: |
          (
            process_resident_memory_bytes /
            (nodejs_heap_size_limit_bytes + 100000000)
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          component: nodejs
          service: stellar-donation-api
        annotations:
          summary: "High memory usage: {{ $value | humanizePercentage }}"
          description: |
            Application is using {{ $value | humanizePercentage }} of available memory.

            May indicate:
            1. Memory leak in recent code
            2. Large data structures in memory
            3. Cache growing unbounded

            Actions:
            1. Review heap dump
            2. Check for recent deployments
            3. Restart application if needed

            Runbook: docs/RUNBOOKS.md#high-memory

      - alert: HighEventLoopLag
        expr: |
          nodejs_eventloop_lag_seconds > 1
        for: 2m
        labels:
          severity: warning
          component: nodejs
          service: stellar-donation-api
        annotations:
          summary: "High event loop lag: {{ $value | humanizeDuration }}"
          description: |
            Node.js event loop is lagging {{ $value | humanizeDuration }}.

            Indicates application is CPU-bound (long-running synchronous operations).

            This will impact request latency.

            Runbook: docs/RUNBOOKS.md#event-loop-lag
